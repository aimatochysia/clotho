[package]
name = "clotho_core"
version = "0.1.0"
edition = "2021"
description = "Core Git, GitHub and update logic for the Clotho app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
thiserror = "2"
# libgit2 is built from source and statically linked, so users never need git installed.
# HTTPS uses the OS TLS stack on Windows/macOS and vendored OpenSSL on Linux/Android.
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"
semver = "1"
sha2 = "0.10"
minisign-verify = "0.2"

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
