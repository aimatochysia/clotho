[package]
name = "clotho_core"
version = "0.1.0"
edition = "2021"
description = "Core Git, GitHub and update logic for the Clotho app"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
thiserror = "2"
# libgit2 is built from source and statically linked, so users never need git installed.
# HTTPS uses the OS TLS stack on Windows/macOS and vendored OpenSSL on Linux/Android.
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"
semver = "1"
sha2 = "0.10"
minisign-verify = "0.2"
flate2 = "1.1.11"
png = "0.18.1"

# Android has no CA file the bundled OpenSSL can find, so the trusted roots are
# loaded into libgit2 by hand (see src/tls.rs). Linux only uses them in tests.
[target.'cfg(target_os = "android")'.dependencies]
libgit2-sys = "0.18.8"
openssl = "0.10"
foreign-types-shared = "0.1"
webpki-root-certs = "1"

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libgit2-sys = "0.18.8"
openssl = "0.10"
foreign-types-shared = "0.1"
webpki-root-certs = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
