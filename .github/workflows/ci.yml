name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  flutter:
    name: Flutter (Linux) + integration test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - run: flutter pub get
      - name: Check formatting (hand-written Dart only)
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/app.dart lib/home test integration_test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Integration test against the real Rust core
        run: xvfb-run -a flutter test integration_test -d linux

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release --split-per-abi
          - target: windows
            os: windows-latest
            command: flutter build windows --release
          - target: macos
            os: macos-latest
            command: flutter build macos --release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - run: flutter pub get
      - run: ${{ matrix.command }}
