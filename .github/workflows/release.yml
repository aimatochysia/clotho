name: Release

# Run from the Actions tab on main. Pull requests that touch packaging run the
# same pipeline as a dry run (version 0.0.0, nothing is published).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump from the latest release tag
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead of a bump (for example 1.4.0)
        required: false
        default: ""
      prerelease:
        description: Mark as a pre-release (the in-app updater skips it)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - tools/**
      - cliff.toml
      - app/android/app/build.gradle.kts

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"
  CLIENT_ID_DEFINE: --dart-define=CLOTHO_GITHUB_CLIENT_ID=${{ vars.CLOTHO_GITHUB_CLIENT_ID }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Only release from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run is on ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [ -n "$EXACT" ]; then
            next="${EXACT#v}"
          elif [ -z "$last" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="${major}.$((minor + 1)).0" ;;
              *)     next="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          if ! [[ "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$next'."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::Tag v$next already exists."
            exit 1
          fi
          echo "Releasing $next (previous: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ steps.version.outputs.version }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - run: cat RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: RELEASE_NOTES.md

  linux:
    name: Linux (.deb, Arch, tar.gz)
    needs: prepare
    # Oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev ninja-build
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" $CLIENT_ID_DEFINE
      - name: tar.gz and .deb
        run: packaging/linux/build-packages.sh "$VERSION" app/build/linux/x64/release/bundle dist
      - name: Arch package
        run: |
          set -euo pipefail
          mkdir -p arch
          cp packaging/arch/PKGBUILD arch/
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/_}/" arch/PKGBUILD
          mv dist/pkgroot arch/pkgroot
          docker run --rm -v "$PWD/arch:/pkg" archlinux:base-devel bash -euc '
            useradd -m builder
            chown -R builder /pkg
            cd /pkg
            su builder -c "makepkg --nodeps --noconfirm"
            chown -R '"$(id -u):$(id -g)"' /pkg
          '
          mv arch/clotho-*-x86_64.pkg.tar.zst "dist/clotho-$VERSION-linux-x86_64.pkg.tar.zst"
      - name: Smoke-test the .deb
        run: |
          sudo apt-get install -y "./dist/clotho-$VERSION-linux-amd64.deb"
          test -x /usr/lib/clotho/clotho
          test -L /usr/bin/clotho
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE" | tr -d '\r\n ' | base64 --decode > app/android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" $CLIENT_ID_DEFINE
      - name: Check the signature and collect the APKs
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="app/build/app/outputs/flutter-apk/app-$abi-release.apk"
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$certs" | head -n3
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
            cp "$apk" "dist/clotho-$VERSION-android-$abi.apk"
          done
      - name: Remove the key
        if: always()
        run: rm -f app/android/app/upload-keystore.jks app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (installer, zip)
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - name: Build
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release --build-name "$env:VERSION" --build-number "$env:GITHUB_RUN_NUMBER" $env:CLIENT_ID_DEFINE
      - name: Zip and installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Resolve-Path 'app\build\windows\x64\runner\Release'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\clotho-$env:VERSION-windows-x64.zip"
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$release" "/DOutputDir=$((Resolve-Path dist).Path)" "/DIconFile=$((Resolve-Path 'app\windows\runner\resources\app_icon.ico').Path)" packaging\windows\clotho.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (dmg)
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/rust
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER" $CLIENT_ID_DEFINE
      - name: Disk image
        run: |
          set -euo pipefail
          app="app/build/macos/Build/Products/Release/clotho.app"
          lipo -info "$app/Contents/MacOS/clotho"
          stage="$(mktemp -d)"
          cp -R "$app" "$stage/Clotho.app"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          hdiutil create -volname "Clotho $VERSION" -srcfolder "$stage" -ov -format UDZO "dist/clotho-$VERSION-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums, signature and GitHub release
    needs: [prepare, linux, android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/release-sign
      - name: Sign the checksum list
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
          UPDATE_PUBLIC_KEY_FILE: packaging/clotho-update.pub
        run: |
          cargo run --quiet --release --manifest-path tools/release-sign/Cargo.toml -- \
            dist/SHA256SUMS.txt "clotho v$VERSION"
      # release-sign already verified the signature against
      # packaging/clotho-update.pub before writing it.
      - name: Check the checksum list
        run: (cd dist && sha256sum --check SHA256SUMS.txt && test -s SHA256SUMS.txt.minisig)
      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v$VERSION" dist/* \
            --title "Clotho $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
      - name: Dry run summary
        if: env.PUBLISH != 'true'
        run: |
          echo "Dry run: built, checksummed and signed these files; nothing was published." >> "$GITHUB_STEP_SUMMARY"
          (cd dist && ls -l) >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sums
          path: dist/SHA256SUMS.txt*

  pages:
    name: Download page
    needs: [prepare, publish]
    if: github.event_name == 'workflow_dispatch' && !inputs.prerelease
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - uses: actions/download-artifact@v4
        with:
          name: sums
      - run: python3 packaging/site/build.py "${{ needs.prepare.outputs.version }}" SHA256SUMS.txt RELEASE_NOTES.md _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
